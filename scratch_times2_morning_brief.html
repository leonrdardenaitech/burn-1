                    </div>

                    {activeStep === 4 && (
                      <div className="p-4 pt-0 space-y-3 font-mono">
                        <p className="text-xs text-slate-300">Compile your inputs into an official, timestamped underwriter proof receipt:</p>
                        <button 
                          onClick={handleIssueReceipt}
                          className="w-full py-3.5 bg-gradient-to-r from-cyan-400 to-emerald-400 hover:brightness-110 text-slate-950 font-black text-xs rounded-xl transition-all shadow-[0_0_20px_rgba(0,240,255,0.4)] uppercase"
                        >
                          ⚡ STAMP &amp; DELIVER VERIFIED RECEIPT
                        </button>
                      </div>
                    )}
                  </div>

                </div>

                {/* THE DELIVERABLE: TIMES2 VERIFIED RECEIPT CARD */}
                {receiptIssued && (
                  <div className="verified-receipt-paper p-5 space-y-3 text-slate-200 font-mono text-xs">
                    <div className="flex justify-between items-center border-b border-cyan-800 pb-2">
                      <span className="font-black text-cyan-300 text-sm">TIMES² VERIFIED RECEIPT</span>
                      <span className="text-[10px] bg-cyan-950 text-cyan-400 px-2 py-0.5 rounded border border-cyan-700 font-bold">
                        OFFICIAL RECORD
                      </span>
                    </div>
                    <div><span className="text-slate-500">VENDOR MONITORED:</span> {vendorName || 'DEFAULT ENTERPRISE'}</div>
                    <div><span className="text-slate-500">PAYMENT SCRIPTS:</span> VERIFIED GENUINE (PCI 4.0 SRI)</div>
                    <div><span className="text-slate-500">DNS INTEGRITY:</span> PASS (0 ORPHANS)</div>
                    <div><span className="text-slate-500">TIMESTAMP:</span> {new Date().toLocaleDateString()} // 08:00 EST</div>
                    <div className="pt-2 text-center text-[11px] text-emerald-400 font-bold border-t border-slate-800">
                      ✓ PERMANENT UNDERWRITER RECORD RECORDED
                    </div>
                  </div>
                )}

              </div>

            </aside>

          </main>

          {/* MANDATORY COMMERCIAL FOOTER */}
          <footer class="p-6 rounded-2xl bg-slate-950 border border-slate-800 text-center font-mono text-xs text-slate-400 space-y-2">
            <div>
              &copy; 2026 Leon R. Darden &bull; <strong>BURN-1 Systems (burn-1.com)</strong>. All rights reserved.
            </div>
            <div className="text-[11px] text-slate-400">
              <a href="terms.html" className="underline hover:text-white">Terms, Privacy &amp; Legal Disclaimer</a> &bull; 
              Delivered within standard business turnaround up to 5 business days &bull; 
              <a href="https://tools.burn-1.com#helpdesk" className="underline text-cyan-400 font-bold ml-1 hover:text-white">Help Desk &amp; Escalations</a>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Times2MorningBrief />);
  </script>
</body>
</html>
