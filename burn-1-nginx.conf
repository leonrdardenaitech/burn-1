# ============================================================
# BURN-1 SYSTEMS SUBDOMAIN ROUTING (NGINX Server Block Config)
# Target Deployment Path: /var/www/burn-1-directory
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name *.burn-1.com burn-1.com www.burn-1.com;

    root /var/www/burn-1-directory;
    index index.html card.html burn1-digital-card.html;

    # Wildcard Subdomain Routing (*.burn-1.com)
    location / {
        # Silently serves card.html while preserving original subdomain URL in browser
        try_files $uri $uri/ /card.html /burn1-digital-card.html =404;
    }

    # Static Assets Cache Control
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|mp4|webm|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
