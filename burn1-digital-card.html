<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burn-1 Digital Business Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap');
        body {
            background-color: #000000; /* Building Black */
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }
        /* Neon Cyan Acrylic Glass Effect */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
        }
        /* Pulse Animation for Scan Badge */
        @keyframes pulse-cyan {
            0%, 100% {
                box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
                border-color: rgba(6, 182, 212, 0.8);
            }
            50% {
                box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
                border-color: rgba(34, 211, 238, 1);
            }
        }
        .pulse-badge {
            animation: pulse-cyan 2.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8 bg-radial-gradient">

    <!-- TOP HEADER / BRANDING -->
    <header class="w-full max-w-md mx-auto text-center pt-4">
        <span class="text-xs font-bold tracking-widest bg-cyan-600/20 text-cyan-400 border border-cyan-500/30 px-3 py-1 uppercase rounded-full">
            Burn-1 Platform Verified
        </span>
    </header>

    <!-- MAIN DYNAMIC CARD CONTAINER -->
    <main class="w-full max-w-md mx-auto my-auto py-6">
        <div id="card-content" class="glass-card rounded-3xl p-6 md:p-8 flex flex-col gap-6 relative overflow-hidden transition-all duration-300">
            
            <!-- Dynamic Category and Status -->
            <div class="flex justify-between items-center">
                <span id="biz-category" class="text-xs font-bold tracking-wider text-cyan-400 uppercase font-mono bg-cyan-950/40 px-2.5 py-1 rounded-md border border-cyan-800/30">
                    LOADING...
                </span>
                <span class="flex h-2.5 w-2.5 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
            </div>

            <!-- Dynamic Business Name -->
            <div class="flex flex-col gap-1.5 mt-2">
                <h1 id="biz-name" class="text-3xl md:text-4xl font-black tracking-tight text-white uppercase leading-none">
                    RETRIEVING BUSINESS...
                </h1>
                <span class="h-1 w-16 bg-cyan-500 rounded-full mt-2"></span>
            </div>

            <!-- Dynamic Address -->
            <div class="flex flex-col gap-1 mt-2">
                <span class="text-[10px] uppercase font-mono tracking-widest text-slate-500 font-bold">PHYSICAL LOCATION</span>
                <p id="biz-address" class="text-sm text-slate-200 leading-relaxed font-bold">
                    --
                </p>
            </div>

            <!-- Dynamic Phone Number -->
            <div class="flex flex-col gap-1">
                <span class="text-[10px] uppercase font-mono tracking-widest text-slate-500 font-bold">TELEPHONE CONTACT</span>
                <p id="biz-phone" class="text-lg text-white font-black tracking-wide font-mono">
                    --
                </p>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="grid grid-cols-2 gap-4 mt-4">
                <a id="btn-call" href="#" class="flex items-center justify-center gap-2 py-3 bg-white text-black font-black text-sm uppercase rounded-xl hover:bg-slate-200 transition-all text-center">
                    📞 Call Now
                </a>
                <a id="btn-navigate" href="#" target="_blank" class="flex items-center justify-center gap-2 py-3 bg-cyan-600 text-white font-black text-sm uppercase rounded-xl hover:bg-cyan-500 transition-all text-center border border-cyan-500/50">
                    📍 Directions
                </a>
            </div>

        </div>

        <!-- FALLBACK INTERACTIVE SELECTOR (Shown only if no subdomain matches) -->
        <div id="selector-container" class="hidden glass-card rounded-3xl p-6 md:p-8 flex flex-col gap-6 text-center">
            <h2 class="text-xl font-black text-white uppercase tracking-tight">Verified Business Cards</h2>
            <p class="text-xs text-slate-400">Select any active merchant on our circuit to load their digital card instantly.</p>
            
            <div id="selector-grid" class="flex flex-col gap-2 max-h-64 overflow-y-auto pr-1">
                <!-- Dynamically generated selection buttons go here -->
            </div>
        </div>
    </main>

    <!-- FOOTER / RETURN NAVIGATION -->
    <footer class="w-full max-w-md mx-auto text-center pb-4 flex flex-col gap-4 items-center">
        <a href="burn1-business-directory-v4.html" class="text-xs font-black text-slate-400 hover:text-cyan-400 uppercase tracking-widest transition-all font-mono">
            ← Return to Directory Hub
        </a>
        <div class="text-[9px] text-slate-600 font-mono">
            © 2026 BURN-1 PLATFORM
        </div>
    </footer>

    <!-- INTERACTIVE SUBDOMAIN ROUTER ENGINE -->
    <script>
        // Grounded Local Business Database
        const BUSINESS_DATABASE = {
            "taddas-fitness": {
                name: "Tadda's Fitness Center",
                category: "Fitness & Wellness",
                address: "2615 Park Central Blvd, Decatur, Georgia 30035",
                phone: "(404) 520-9119",
                mapSearch: "Taddas Fitness Center 2615 Park Central Blvd Decatur GA"
            },
            "gladiator-martial-arts": {
                name: "Gladiator Martial Arts",
                category: "Martial Arts & Self-Defense",
                address: "6025 Covington Hwy, Decatur, Georgia 30035",
                phone: "(470) 676-7399",
                mapSearch: "Gladiator Martial Arts 6025 Covington Hwy Decatur GA"
            },
            "the-cigar-bar": {
                name: "The Cigar Bar",
                category: "Lounge & Dining",
                address: "2617 Panola Rd Suite 103, Lithonia, Georgia 30058",
                phone: "(470) 375-8879",
                mapSearch: "The Cigar Bar 2617 Panola Rd Lithonia GA"
            },
            "auto-motion-wheel-repairs": {
                name: "Auto Motion Wheel Repairs",
                category: "Auto Services",
                address: "2526 Panola Rd, Lithonia, Georgia 30058",
                phone: "(404) 299-7255",
                mapSearch: "Auto Motion Wheel Repairs 2526 Panola Rd Lithonia GA"
            },
            "ac-event-space": {
                name: "A&C Event Space",
                category: "Event Services",
                address: "2412 Park Central Blvd, Decatur, Georgia 30035",
                phone: "(678) 891-9253",
                mapSearch: "A and C Event Space 2412 Park Central Blvd Decatur GA"
            },
            "force-xtreme-cheer": {
                name: "Force Xtreme Cheer",
                category: "Youth Sports & Camps",
                address: "2520 Park Central Blvd, Suite D2, Decatur, Georgia 30035",
                phone: "(470) 413-8003",
                mapSearch: "Force Xtreme Cheer 2520 Park Central Blvd Decatur GA"
            },
            "steel-mill-wellness": {
                name: "Steel Mill Wellness Center",
                category: "Gym & Fitness",
                address: "2500 Park Central Blvd, Suite A1, Decatur, Georgia 30035",
                phone: "(404) 516-5469",
                mapSearch: "Steel Mill Wellness Center 2500 Park Central Blvd Decatur GA"
            },
            "progressive-dental": {
                name: "Progressive Dental Group",
                category: "Medical & Health",
                address: "2485 Park Central Blvd #3, Lithonia, Georgia 30035",
                phone: "(770) 593-4976",
                mapSearch: "Progressive Dental Group 2485 Park Central Blvd Lithonia GA"
            }
        };

        function routeDigitalCard() {
            // Get current host (e.g. "the-cigar-bar.burn-1.com" or "localhost")
            const host = window.location.hostname;
            const parts = host.split('.');
            
            let matchedKey = null;

            // 1. Subdomain Check: If hostname contains subdomains (e.g. key.burn-1.com)
            if (parts.length > 2 && parts[0] !== 'www') {
                const subdomain = parts[0].toLowerCase();
                if (BUSINESS_DATABASE[subdomain]) {
                    matchedKey = subdomain;
                }
            }

            // 2. URL Parameter Fallback Check (for testing in local workspaces/directories: ?biz=the-cigar-bar)
            if (!matchedKey) {
                const urlParams = new URLSearchParams(window.location.search);
                const queryBiz = urlParams.get('biz');
                if (queryBiz && BUSINESS_DATABASE[queryBiz.toLowerCase()]) {
                    matchedKey = queryBiz.toLowerCase();
                }
            }

            // 3. Render matched card or display fallback list
            if (matchedKey) {
                renderCard(BUSINESS_DATABASE[matchedKey]);
            } else {
                showFallbackSelector();
            }
        }

        function renderCard(biz) {
            document.getElementById('biz-name').innerText = biz.name;
            document.getElementById('biz-category').innerText = biz.category;
            document.getElementById('biz-address').innerText = biz.address;
            document.getElementById('biz-phone').innerText = biz.phone;
            
            // Set href protocols cleanly
            document.getElementById('btn-call').href = `tel:${biz.phone.replace(/[^0-9]/g, '')}`;
            document.getElementById('btn-navigate').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(biz.mapSearch)}`;
            
            document.getElementById('card-content').classList.remove('hidden');
            document.getElementById('selector-container').classList.add('hidden');
        }

        function showFallbackSelector() {
            document.getElementById('card-content').classList.add('hidden');
            const selectorContainer = document.getElementById('selector-container');
            const selectorGrid = document.getElementById('selector-grid');
            
            selectorGrid.innerHTML = '';
            
            // Populate buttons for local testing or general routing
            Object.keys(BUSINESS_DATABASE).forEach(key => {
                const biz = BUSINESS_DATABASE[key];
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-xl transition-all flex flex-col gap-0.5 group";
                btn.innerHTML = `
                    <span class="text-[9px] font-mono text-cyan-400 group-hover:text-cyan-300 font-bold uppercase">${biz.category}</span>
                    <span class="text-sm font-black text-slate-200 group-hover:text-white uppercase">${biz.name}</span>
                `;
                btn.onclick = () => renderCard(biz);
                selectorGrid.appendChild(btn);
            });

            selectorContainer.classList.remove('hidden');
        }

        // Initialize Router
        window.onload = routeDigitalCard;
    </script>
</body>
</html>
