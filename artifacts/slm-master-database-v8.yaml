version: '8.0'
platform: BURN-1 Autonomous SLM Engine & APEA Diagnostic Core
description: Master Unified SLM Database Manifest v8.0 containing State Compliance
  & Governance rules, Industry-Specific Protocol PLUS Marketplace Schemas (Protocols
  1-12 A-L), non-intrusive passive telemetry protocols, and Underwriter Metric Mappings.
last_updated: '2026-10-31'
scanning_engine:
  mode: 100% Agentless & Non-Intrusive
  execution_time: 60-Second Passive Sweep
  operational_risk: ZERO Downtime / Safe for Critical Infrastructure & SCADA
  telemetry_protocols:
  - category: Email Authenticity & Anti-Spoofing
    protocols:
    - DMARC (p=none/quarantine/reject)
    - SPF TXT Record Scope
    - DKIM Cryptographic Key
    - BIMI Brand Indicator
  - category: Web Transport & HTTP Header Hygiene
    protocols:
    - HSTS (Strict-Transport-Security)
    - Content-Security-Policy (CSP)
    - CORS (Access-Control-Allow-Origin)
    - X-Frame-Options (Clickjacking)
    - X-Content-Type-Options (nosniff)
  - category: DNS & Certificate Infrastructure
    protocols:
    - DNSSEC Validation
    - CAA Record Authorization
    - TLS/SSL Handshake & Expiration (TLS 1.2/1.3 Enforcement)
  - category: Perimeter & Service Cloaking
    protocols:
    - Passive Port 3389 (RDP) Exposure
    - Passive Port 445 (SMB) Exposure
    - SNMP Port 161 Check
    - Zero Trust VPN Cloaking
  - category: Threat Intelligence & Vulnerabilities
    protocols:
    - Public Banner Software Versioning
    - CVE / CVSS Base Scoring
    - CISA Known Exploited Vulnerabilities (KEV) Catalog Matching
    - Dark Web Credential Breach Intelligence
state_compliance_governance:
  california_ccpa_cpra:
    mandate: California Consumer Privacy Act & CPRA Amendments
    key_requirements:
    - Mandatory annual cybersecurity audits for high-risk data processing
    - PCI DSS v4.0 Req 6.4.3 & 11.6.1 script inventory on checkout pages
    - Consumer data deletion and opt-out API verification
  new_york_nydfs_part_500:
    mandate: 23 NYCRR Part 500 (2026 Enforcement Update)
    key_requirements:
    - "Universal MFA (\xA7 500.12) enforced across all user access, SaaS, and web\
      \ portals"
    - "Phishing-resistant authentication tokens (device recognition alone fails \xA7\
      \ 500.12)"
    - Sept 2026 Risk Assessment Guidance & Dual CISO/CEO Annual Compliance Attestation
  washington_mhmd:
    mandate: Washington My Health My Data Act (MHMD)
    key_requirements:
    - Strict opt-in consent for consumer health data outside HIPAA HIPAA boundaries
    - Perimeter tracking script lockdown on health/wellness intake pages
    - Private right of action shielding for non-consensual health data transfer
  texas_hb_300:
    mandate: Texas Medical Records Privacy Act (HB 300)
    key_requirements:
    - 15-day employee HIPAA/HB 300 training mandate
    - Expanded definition of covered entities including tech contractors handling
      ePHI
    - Strict 15-day statutory breach disclosure window to state AG
  nevada_gaming_reg_5_260:
    mandate: Nevada Gaming Commission Regulation 5.260 & Form 2.24.26
    key_requirements:
    - Mandatory 24-hour initial cyber incident notification form filing
    - Quarterly external vulnerability assessments for casino networks
    - Title 31 AML/Cyber vendor due diligence for gaming floors
  state_water_dep_guidance:
    mandate: State Environmental Protection Agency & EPA Water SCADA Rules
    key_requirements:
    - Mandatory OT/SCADA network isolation for public drinking water systems
    - Zero public WAN exposure for Modbus, DNP3, and BACnet controllers
    - 24-hour CISA / State DEP incident report SLA
