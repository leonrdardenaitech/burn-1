<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BURN-1 // Acid Division v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="[suspicious link removed]">
  <link href="[suspicious link removed]" rel="stylesheet">

  <style>
    body {
      background-color: #05080d;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Borosilicate Glass Frosted Panels */
    .frosted-glass-title {
      background: rgba(14, 20, 32, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(57, 255, 20, 0.35);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
    }
    .frosted-glass-title.active {
      border-color: #39ff14;
      box-shadow: 0 0 25px rgba(57, 255, 20, 0.25), inset 0 1px 1px rgba(57, 255, 20, 0.3);
    }

    /* Chemical Liquid Glass Tube */
    .glass-tube-container {
      background: rgba(10, 14, 22, 0.85);
      border: 1px solid rgba(57, 255, 20, 0.3);
      border-radius: 9999px;
      padding: 3px;
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.15), inset 0 2px 5px rgba(0,0,0,0.8);
    }
    .liquid-stream {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #1b870b 0%, #39ff14 70%, #7bfd62 100%);
      box-shadow: 0 0 15px #39ff14;
      transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* "Start Here" Capsule Button */
    .capsule-pulse-btn {
      background: linear-gradient(180deg, #ffb800 0%, #d49200 100%);
      color: #05080d;
      font-weight: 900;
      letter-spacing: 0.12em;
      border: 1px solid #ffd043;
      box-shadow: 0 0 20px rgba(255, 184, 0, 0.4);
      animation: capsulePulse 2.5s infinite;
    }
    @keyframes capsulePulse {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 184, 0, 0.3); transform: scale(1); }
      50% { box-shadow: 0 0 30px rgba(255, 184, 0, 0.7); transform: scale(1.015); }
    }

    /* 3D Flip Card Mechanics */
    .flip-card { perspective: 1000px; height: 320px; }
    .flip-card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      position: absolute; width: 100%; height: 100%;
      -webkit-backface-visibility: hidden; backface-visibility: hidden;
      border-radius: 8px;
    }
    .flip-card-back { transform: rotateY(180deg); }

    /* Expandable Live Clipboard */
    .clipboard-mini {
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: top right;
    }
    .clipboard-mini:hover {
      transform: scale(1.35);
      z-index: 100;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(57, 255, 20, 0.25);
    }
  </style>
</head>
<body class="p-4 sm:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const INDUSTRY_DATA = {
      manufacturing: [
        { id: 'p1', name: 'THE CAUSTIC WASHDOWN', code: 'OSHA 1910.119', price: '$99', desc: 'Workplace HazCom & chemical process safety attestation.', detail: 'Captures SDS accessibility, secondary containment berms, and LOTO procedures before state inspectors arrive.' },
        { id: 'p2', name: 'LIVE WIRE ISOLATION', code: 'NIST 800-82r3', price: '$99', desc: 'OT & Industrial control network isolation.', detail: 'Validates air-gap status of PLC, SCADA, and Modbus networks against exposed WAN telemetry.' },
        { id: 'p3', name: 'STRUCTURAL INTEGRITY', code: 'ASHRAE 135', price: '$99', desc: 'Smart Building & HVAC isolation check.', detail: 'Monitors BAS/BMS exposure and elevator network bridging to prevent lateral plant pivots.' }
      ],
      warehouse: [
        { id: 'p4', name: 'CORROSIVE SHEET TEST', code: 'OSHA 1910.1200', price: '$49', desc: 'Digital SDS accessibility & compliance logging.', detail: 'Checks real-time mobile availability of Safety Data Sheets for all warehouse dock workers.' },
        { id: 'p5', name: 'SECONDARY BERM LOGS', code: 'EPA SPCC 40 CFR', price: '$99', desc: 'Physical drum storage & containment audit.', detail: 'Verifies 110% containment capacity for outdoor and indoor liquid storage areas.' },
        { id: 'p6', name: 'TOXIC CHAIN SWEEP', code: 'OFAC & TSCA', price: '$150', desc: 'Supplier & chemical receiver screening.', detail: 'Audits inbound freight protocols and foreign supplier regulatory declarations.' }
      ],
      chemical: [
        { id: 'p7', name: 'REACTIVE VAPOR SEAL', code: 'EPA RMP 40 CFR 68', price: '$150', desc: 'Toxic chemical process hazard analysis.', detail: 'Pits physical plant buffer setbacks against municipal residential zoning maps.' },
        { id: 'p8', name: 'ACID RAIN DEFENSE', code: 'AWIA SEC. 2013', price: '$150', desc: 'Municipal wastewater infrastructure audit.', detail: 'Validates physical intake telemetry and emergency power/chlorine failovers.' },
        { id: 'p9', name: 'THERMAL QUENCH AUDIT', code: 'FSMA SEC. 204', price: '$99', desc: 'Cyber-HACCP cold chain logging.', detail: 'Binds temperature tracking records and digital pasteurization logs.' }
      ]
    };

    const UltraBarApp = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [currentStep, setCurrentStep] = useState(1);
      const [industry, setIndustry] = useState('manufacturing');
      const [flippedCard, setFlippedCard] = useState(null);
      const [formData, setFormData] = useState({ facility: '', address: '', eyewashConfirmed: false, bermsVerified: false });
      const [isSubmitted, setIsSubmitted] = useState(false);

      const STEPS = [
        { id: 1, title: 'BATCH INTAKE', pct: 20 },
        { id: 2, title: 'PLUME RECON', pct: 40 },
        { id: 3, title: 'CONTAINMENT AUDIT', pct: 60 },
        { id: 4, title: 'SECONDARY BERM LOGS', pct: 80 },
        { id: 5, title: 'CHEMICAL BURN & SEAL', pct: 100 }
      ];

      const currentProgress = isSubmitted ? 100 : isOpen ? STEPS[currentStep - 1].pct : 5;

      return (
        <div className="max-w-7xl mx-auto space-y-10">

          {/* --- TOP HERO SECTION --- */}
          <header className="text-center space-y-4 pt-6">
            <div className="inline-block px-3 py-1 bg-[#39ff14]/10 border border-[#39ff14]/30 text-[#39ff14] text-xs font-mono font-bold tracking-widest rounded-full uppercase">
              Perimeter Telemetry • Physical Attestation • Machine Seal
            </div>
            <h1 className="text-4xl sm:text-6xl font-black tracking-tight text-white">
              YOUR SAFETY CONTROLS LOOK FINE ON PAPER.
            </h1>
            <p className="text-xl sm:text-2xl font-bold text-slate-400 max-w-3xl mx-auto">
              What happens when the county actually shows up?
            </p>

            {/* Borosilicate Glass Liquid Tube */}
            <div className="max-w-2xl mx-auto pt-4">
              <div className="flex justify-between text-xs font-mono font-bold text-[#39ff14] mb-2 tracking-wider">
                <span>SYSTEM STATUS: {isSubmitted ? 'EVIDENCE COLLECTED // AWAITING 24H RECON' : isOpen ? `PHASE ${currentStep} OF 5` : 'STANDBY'}</span>
                <span>{currentProgress}% VOL</span>
              </div>
              <div className="h-6 glass-tube-container">
                <div className="liquid-stream" style={{ width: `${currentProgress}%` }}></div>
              </div>
            </div>

            {/* "START HERE" Pulsing Capsule Banner */}
            {!isOpen && !isSubmitted && (
              <div className="pt-4">
                <button
                  onClick={() => setIsOpen(true)}
                  className="capsule-pulse-btn px-8 py-4 rounded-full text-sm font-mono flex items-center gap-3 mx-auto uppercase cursor-pointer"
                >
                  <i className="fa-solid fa-bolt text-lg"></i>
                  <span>START HERE // INITIALIZE HAZMAT BINDER</span>
                  <i className="fa-solid fa-arrow-right text-lg"></i>
                </button>
              </div>
            )}
          </header>

          {/* --- MAIN INTERACTIVE WORKSPACE (SPLIT SCREEN) --- */}
          {isOpen && !isSubmitted && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start relative z-50">
              
              {/* LEFT COLUMN: THE ULTRA BAR ACCORDION (7 Cols) */}
              <div className="lg:col-span-8 space-y-4">
                
                {/* Frosted Glass Header Banner */}
                <div 
                  onClick={() => setIsOpen(!isOpen)}
                  className="frosted-glass-title active rounded-lg p-5 flex items-center justify-between cursor-pointer"
                >
                  <div className="flex items-center gap-4">
                    <div className="w-3 h-3 rounded-full bg-[#39ff14] shadow-[0_0_10px_#39ff14]"></div>
                    <span className="font-mono font-bold text-lg text-white tracking-wider">
                      LEON'S ULTRA BAR // ARCHITECTURE WORKSPACE
                    </span>
                  </div>
                  <div className="flex items-center gap-3 font-mono text-xs text-[#39ff14]">
                    <span>[COLLAPSE CONSOLE]</span>
                    <i className="fa-solid fa-chevron-up"></i>
                  </div>
                </div>

                {/* EYE-LEVEL PINNED WORKSPACE */}
                <div className="frosted-glass-title rounded-lg p-8 space-y-6">
                  
                  {/* Step Tabs Navigation */}
                  <div className="flex gap-2 border-b border-slate-800 pb-4 overflow-x-auto">
                    {STEPS.map((s) => (
                      <button
                        key={s.id}
                        onClick={() => setCurrentStep(s.id)}
                        className={`px-3 py-2 font-mono text-xs font-bold rounded transition-colors ${
                          currentStep === s.id 
                            ? 'bg-[#39ff14] text-black shadow-[0_0_12px_#39ff14]' 
                            : 'bg-slate-900 text-slate-400 hover:text-white'
                        }`}
                      >
                        {s.title}
                      </button>
                    ))}
                  </div>

                  {/* STEP 1 CONTENT */}
                  {currentStep === 1 && (
                    <div className="space-y-5">
                      <div className="text-2xl font-black text-white">STEP 1: FACILITY IDENTIFICATION</div>
                      <p className="text-slate-400 text-sm">Enter plant coordinates to bind local county zoning and municipal drainage ordinances.</p>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input
                          type="text"
                          placeholder="Facility / Plant Name"
                          value={formData.facility}
                          onChange={(e) => setFormData({ ...formData, facility: e.target.value })}
                          className="bg-slate-950/80 border border-slate-700 p-4 rounded text-white font-mono text-sm focus:border-[#39ff14] outline-none"
                        />
                        <input
                          type="text"
                          placeholder="Street Address, City, State"
                          value={formData.address}
                          onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                          className="bg-slate-950/80 border border-slate-700 p-4 rounded text-white font-mono text-sm focus:border-[#39ff14] outline-none"
                        />
                      </div>
                      <button 
                        onClick={() => setCurrentStep(2)} 
                        className="w-full bg-[#39ff14] hover:bg-[#32e012] text-black font-black font-mono py-4 rounded transition-all shadow-[0_0_15px_rgba(57,255,20,0.3)]"
                      >
                        LOCK INTAKE & ADVANCE TO RADAR RECON →
                      </button>
                    </div>
                  )}

                  {/* STEP 2 CONTENT */}
                  {currentStep === 2 && (
                    <div className="space-y-5 text-center py-6">
                      <div className="text-2xl font-black text-white">STEP 2: PERIMETER RADAR ACQUISITION</div>
                      <div className="p-6 bg-black/60 border border-[#39ff14]/30 rounded font-mono text-xs text-left text-[#39ff14] space-y-2">
                        <div>&gt; QUERYING GIS ZONING DATABASE... FOUND: INDUSTRIAL HEAVY (M-2)</div>
                        <div>&gt; RESOLVING MUNICIPAL DRAINAGE SETBACKS... REQUIREMENT: 110% LIQUID BUFFER</div>
                        <div>&gt; SATELLITE PERIMETER PARSED: ZERO OPEN DISCHARGE DETECTED</div>
                      </div>
                      <button 
                        onClick={() => setCurrentStep(3)} 
                        className="w-full bg-[#39ff14] text-black font-black font-mono py-4 rounded"
                      >
                        CONFIRM ORDINANCES & PROCEED TO ATTESTATION →
                      </button>
                    </div>
                  )}

                  {/* STEP 3 CONTENT */}
                  {currentStep === 3 && (
                    <div className="space-y-5">
                      <div className="text-2xl font-black text-white">STEP 3: INTERNAL SAFETY ATTESTATIONS</div>
                      <div className="space-y-3 font-mono text-sm">
                        <label className="flex items-center gap-3 p-4 bg-slate-950/60 border border-slate-800 rounded cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={formData.eyewashConfirmed}
                            onChange={(e) => setFormData({ ...formData, eyewashConfirmed: e.target.checked })}
                            className="w-5 h-5 accent-[#39ff14]" 
                          />
                          <span>Eyewash & Emergency Drench Showers tested within last 7 days (ANSI Z358.1)</span>
                        </label>
                        <label className="flex items-center gap-3 p-4 bg-slate-950/60 border border-slate-800 rounded cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={formData.bermsVerified}
                            onChange={(e) => setFormData({ ...formData, bermsVerified: e.target.checked })}
                            className="w-5 h-5 accent-[#39ff14]" 
                          />
                          <span>Outdoor drums stored on secondary containment pallets with drain plugs locked</span>
                        </label>
                      </div>
                      <button 
                        onClick={() => setCurrentStep(4)} 
                        className="w-full bg-[#39ff14] text-black font-black font-mono py-4 rounded"
                      >
                        SAVE ATTESTATION & OPEN EVIDENCE DROP →
                      </button>
                    </div>
                  )}

                  {/* STEP 4 CONTENT */}
                  {currentStep === 4 && (
                    <div className="space-y-5">
                      <div className="text-2xl font-black text-white">STEP 4: PHYSICAL EVIDENCE PHOTO DROP</div>
                      <div className="border-2 border-dashed border-[#39ff14]/40 p-8 rounded-lg text-center bg-black/40 space-y-3">
                        <i className="fa-solid fa-camera text-3xl text-[#39ff14]"></i>
                        <div className="font-mono text-sm text-slate-300">DRAG & DROP BERM PHOTO OR REPLY VIA MOBILE EMAIL BRIDGE</div>
                        <div className="text-xs text-slate-500">File attached: berm_evidence_geo_tagged.jpg (Simulated)</div>
                      </div>
                      <button 
                        onClick={() => setCurrentStep(5)} 
                        className="w-full bg-[#39ff14] text-black font-black font-mono py-4 rounded"
                      >
                        BIND EVIDENCE & ADVANCE TO SEAL →
                      </button>
                    </div>
                  )}

                  {/* STEP 5 CONTENT */}
                  {currentStep === 5 && (
                    <div className="space-y-5">
                      <div className="text-2xl font-black text-white">STEP 5: MACHINE TIMESTAMP & CRYPTOGRAPHIC SEAL</div>
                      <p className="text-slate-400 text-sm">
                        Internal attestation and physical photos are locked into the binder. BURN-1 will complete independent municipal reconnaissance.
                      </p>
                      <button 
                        onClick={() => { setIsSubmitted(true); setIsOpen(false); }} 
                        className="w-full bg-gradient-to-r from-[#ffb800] to-[#39ff14] text-black font-black font-mono py-5 rounded-lg text-base shadow-[0_0_25px_rgba(57,255,20,0.4)] cursor-pointer"
                      >
                        COMMIT BINDER // COMMENCE 24H RECON LOOP ⚡
                      </button>
                    </div>
                  )}

                </div>
              </div>

              {/* RIGHT COLUMN: LIVE CLIPBOARD SHEET (Enlarges on Hover) (4 Cols) */}
              <div className="lg:col-span-4 sticky top-6">
                <div className="clipboard-mini bg-[#0f1420] border-2 border-slate-700 rounded-lg p-5 shadow-2xl relative">
                  
                  {/* Metal Clipboard Top Clip */}
                  <div className="w-24 h-4 bg-slate-600 rounded-b mx-auto -mt-5 mb-4 border border-slate-500 shadow flex items-center justify-center">
                    <div className="w-12 h-1 bg-slate-800 rounded"></div>
                  </div>

                  <div className="border-b border-slate-800 pb-3 mb-3 flex justify-between items-center">
                    <div>
                      <div className="text-[10px] font-mono text-[#39ff14] font-bold">BURN-1 EVIDENCE DOSSIER</div>
                      <div className="text-xs font-black text-white">HAZMAT DEFENSE SHEET</div>
                    </div>
                    <div className="text-[9px] font-mono bg-red-950 border border-red-600 text-red-400 px-1 py-0.5 rounded">
                      DRAFT RECORD
                    </div>
                  </div>

                  <div className="space-y-3 font-mono text-[11px] text-slate-300">
                    <div><span className="text-slate-500">FACILITY:</span> {formData.facility || '<AWAITING STEP 1>'}</div>
                    <div><span className="text-slate-500">ADDRESS:</span> {formData.address || '<AWAITING STEP 1>'}</div>
                    <div><span className="text-slate-500">ORDINANCES:</span> {currentStep >= 2 ? 'MUNICODE M-2 VERIFIED' : 'PENDING RECON'}</div>
                    <div><span className="text-slate-500">EYEWASH:</span> {formData.eyewashConfirmed ? '✓ ATTESTED' : 'NOT SIGNED'}</div>
                    <div><span className="text-slate-500">BERMS:</span> {formData.bermsVerified ? '✓ 110% CAPACITY' : 'NOT SIGNED'}</div>
                    <div><span className="text-slate-500">PHOTO:</span> {currentStep >= 4 ? '✓ 1 ASSET LOADED' : 'AWAITING UPLOAD'}</div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-slate-800 text-center">
                    <span className="text-[10px] font-mono text-[#ffb800]">
                      [HOVER TO EXPAND VIEW]
                    </span>
                  </div>
                </div>
              </div>

            </div>
          )}

          {/* --- SUBMITTED / 24-HOUR NOTICE STATE --- */}
          {isSubmitted && (
            <div className="max-w-2xl mx-auto frosted-glass-title active rounded-xl p-8 text-center space-y-4">
              <div className="w-16 h-16 rounded-full bg-[#39ff14]/20 border border-[#39ff14] text-[#39ff14] flex items-center justify-center mx-auto text-2xl shadow-[0_0_20px_#39ff14]">
                <i className="fa-solid fa-clock"></i>
              </div>
              <h2 className="text-2xl font-black text-white font-mono">STATUS: ATTESTATION LOGGED // RECON IN PROGRESS</h2>
              <p className="text-slate-300 text-sm leading-relaxed">
                BURN-1 is now gathering outside perimeter telemetry and municipal regulatory citations. 
                <strong> This collection process may take up to 24 hours.</strong>
              </p>
              <div className="p-3 bg-black/60 rounded font-mono text-xs text-[#39ff14]">
                RECORD ID: ACD-B1-8842 • TIMESTAMP: {new Date().toISOString()}
              </div>
              <p className="text-slate-500 text-xs">
                You will receive an email once reconnaissance is complete with your link to unlock the final cryptographic seal.
              </p>
            </div>
          )}

          {/* --- BELOW THE FOLD: INDUSTRY SELECTOR & 3-CARD DECK --- */}
          <section className="pt-12 border-t border-slate-800 space-y-8">
            <div className="text-center space-y-2">
              <h2 className="text-2xl sm:text-3xl font-black text-white">SELECT YOUR SECTOR MANDATE</h2>
              <p className="text-slate-400 text-sm">Showing 3 high-liability hazard profiles for your facility type.</p>
            </div>

            {/* Segmented Industry Switcher */}
            <div className="flex justify-center gap-3 font-mono text-xs">
              <button
                onClick={() => setIndustry('manufacturing')}
                className={`px-4 py-2.5 rounded border ${industry === 'manufacturing' ? 'bg-[#39ff14] text-black border-[#39ff14] font-bold' : 'bg-slate-900 text-slate-400 border-slate-700'}`}
              >
                🏭 HEAVY MANUFACTURING
              </button>
              <button
                onClick={() => setIndustry('warehouse')}
                className={`px-4 py-2.5 rounded border ${industry === 'warehouse' ? 'bg-[#39ff14] text-black border-[#39ff14] font-bold' : 'bg-slate-900 text-slate-400 border-slate-700'}`}
              >
                📦 WAREHOUSE & LOGISTICS
              </button>
              <button
                onClick={() => setIndustry('chemical')}
                className={`px-4 py-2.5 rounded border ${industry === 'chemical' ? 'bg-[#39ff14] text-black border-[#39ff14] font-bold' : 'bg-slate-900 text-slate-400 border-slate-700'}`}
              >
                💧 CHEMICAL & UTILITIES
              </button>
            </div>

            {/* The 3 Flip Cards */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {INDUSTRY_DATA[industry].map((item) => {
                const isFlipped = flippedCard === item.id;
                return (
                  <div 
                    key={item.id} 
                    className={`flip-card cursor-pointer ${isFlipped ? 'flipped' : ''}`}
                    onClick={() => setFlippedCard(isFlipped ? null : item.id)}
                  >
                    <div className="flip-card-inner">
                      
                      {/* FRONT OF CARD (Why & Purpose) */}
                      <div className="flip-card-front frosted-glass-title p-6 flex flex-col justify-between">
                        <div className="space-y-3">
                          <div className="flex justify-between items-center text-xs font-mono text-[#ffb800]">
                            <span>{item.code}</span>
                            <span>{item.price}</span>
                          </div>
                          <div className="text-xl font-black text-white">{item.name}</div>
                          <p className="text-slate-400 text-sm leading-relaxed">{item.desc}</p>
                        </div>
                        <div className="text-xs font-mono text-[#39ff14] flex items-center justify-between pt-4 border-t border-slate-800">
                          <span>CLICK TO INSPECT SCOPE</span>
                          <i className="fa-solid fa-arrow-rotate-right"></i>
                        </div>
                      </div>

                      {/* BACK OF CARD (Deliverable & Action) */}
                      <div className="flip-card-back frosted-glass-title p-6 flex flex-col justify-between border-[#39ff14]">
                        <div className="space-y-3">
                          <div className="text-xs font-mono text-[#39ff14] font-bold">WHAT YOU GET:</div>
                          <p className="text-slate-300 text-sm leading-relaxed">{item.detail}</p>
                          <div className="text-2xl font-black text-white font-mono">{item.price} <span className="text-xs font-normal text-slate-500">/ BINDER</span></div>
                        </div>
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            setIsOpen(true);
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                          }}
                          className="w-full bg-[#39ff14] text-black font-bold font-mono py-2.5 rounded text-xs uppercase"
                        >
                          LOAD INTO ULTRA BAR ↑
                        </button>
                      </div>

                    </div>
                  </div>
                );
              })}
            </div>
          </section>

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<UltraBarApp />);
  </script>
</body>
</html>
