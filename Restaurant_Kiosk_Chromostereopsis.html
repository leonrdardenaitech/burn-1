<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spatial Kiosk - Mobile Blitz Template</title>
<style>
  :root {
    --brand-color: #D4621A; 
    --glass-bg: rgba(26, 13, 0, 0.85); 
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Georgia', serif;
  }

  /* THE 3:4 MOBILE FRAME (Locks aspect ratio for phones) */
  #mobile-frame {
    position: relative;
    width: 100%;
    max-width: 450px; /* Looks like a phone even on desktop */
    height: 100dvh;
    max-height: 800px;
    background-image: url('storefront_bg.jpg'); /* The AI generated image */
    background-size: cover;
    background-position: center;
    overflow: hidden;
    box-shadow: 0px 0px 30px rgba(212, 98, 26, 0.2);
  }

  /* 
   =========================================
   THE VISUAL COORDINATES (Logos & Text)
   =========================================
  */
  .coord-layer {
    position: absolute;
    z-index: 5;
    pointer-events: none; /* Clicks pass through to hotspots */
  }

  /* Coordinate 1: The Main Brand Logo Overlay (Top Left) */
  #coord-logo {
    top: 15%;
    left: 8%;
    width: 40%;
    max-height: 15%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }
  #coord-logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0px 5px 15px rgba(0,0,0,0.8)); /* Makes logo pop */
  }

  /* Coordinate 2: Glowing Neon Wall Text (Center Right) */
  #coord-text {
    top: 35%;
    right: 10%;
    color: var(--brand-color);
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 0px 0px 15px rgba(212, 98, 26, 0.8), 0px 5px 10px rgba(0,0,0,0.9);
  }

  /* 
   =========================================
   THE INVISIBLE HOTSPOTS (Clickable Zones)
   =========================================
  */
  .hotspot {
    position: absolute;
    z-index: 10;
    cursor: pointer;
    /* border: 2px dashed rgba(255,0,0,0.5); /* Uncomment to see boxes */
  }

  /* Target: The Cashier (Bottom Right) */
  .hotspot-cashier {
    top: 45%;
    right: 5%;
    width: 35%;
    height: 35%;
  }

  /* Target: The Door/Overhead Menu (Left Side) */
  .hotspot-menu {
    top: 30%;
    left: 5%;
    width: 35%;
    height: 40%;
  }

  /* 
   =========================================
   THE SLIDING SIDE MENU (Frictionless UI)
   =========================================
  */
  #side-menu {
    position: absolute; /* Locked to the mobile frame */
    top: 0;
    left: 0;
    width: 85%;
    height: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    border-right: 1px solid rgba(212, 98, 26, 0.3);
    color: #FDF6EC;
    display: flex;
    flex-direction: column;
  }

  #side-menu.active {
    transform: translateX(0%);
  }

  .menu-header { padding: 30px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
  .close-btn { background: none; border: none; color: var(--brand-color); font-size: 24px; cursor: pointer; }
  .menu-content { padding: 20px; overflow-y: auto; flex-grow: 1; }
  .menu-item { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .item-title { font-size: 18px; font-weight: bold; }
  .item-desc { font-size: 12px; opacity: 0.6; margin-top: 5px; }
  .item-price { color: var(--brand-color); font-family: monospace; font-size: 16px; margin-top: 5px;}
  
  .place-order-btn { margin: 20px; padding: 15px; background-color: var(--brand-color); color: #000; text-align: center; font-weight: 900; text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
</style>
</head>
<body>

<div id="mobile-frame">
  <!-- 1. THE DYNAMIC LOGO / TEXT OVERLAYS -->
  <div class="coord-layer" id="coord-logo">
    <!-- Drop a client's transparent logo here, or leave empty if the AI baked it in -->
    <img src="client_logo.png" alt="Brand Logo" onerror="this.style.display='none'">
  </div>
  
  <div class="coord-layer" id="coord-text"></div>

  <!-- 2. THE FIXED HOTSPOTS -->
  <div class="hotspot hotspot-cashier" onclick="openMenu('wings', 'Gourmet Wings')"></div>
  <div class="hotspot hotspot-menu" onclick="openMenu('pizza', 'Brick Oven Pizza')"></div>

  <!-- 3. THE SLIDING MENU -->
  <div id="side-menu">
    <div class="menu-header">
      <h2 id="menu-title" style="margin: 0; font-size: 24px;">Menu</h2>
      <button class="close-btn" onclick="closeMenu()">✕</button>
    </div>
    <div class="menu-content" id="menu-items-container"></div>
    <div class="place-order-btn" onclick="placeOrder()">Send Order to Kitchen</div>
  </div>
</div>

<script>
  // Dynamic Text Injection
  const masterBrandName = "WING EMPIRE";
  document.getElementById('coord-text').innerText = masterBrandName;

  // The Deep Menus
  const menus = {
    wings: [
      { name: "Lemon Pepper Wet", desc: "Crispy fried, tossed in house butter.", price: "$14.00" },
      { name: "Obsidian BBQ", desc: "Smoked wings glazed in dark honey BBQ.", price: "$15.00" }
    ],
    pizza: [
      { name: "Margherita Pie", desc: "Fresh mozzarella, basil, tomato.", price: "$20.00" },
      { name: "Truffle Mushroom", desc: "White base, wild mushrooms.", price: "$24.00" }
    ]
  };

  const sideMenu = document.getElementById('side-menu');
  const menuContainer = document.getElementById('menu-items-container');
  const menuTitle = document.getElementById('menu-title');

  function openMenu(menuType, title) {
    menuTitle.innerText = title;
    menuContainer.innerHTML = ''; 
    menus[menuType].forEach(item => {
      menuContainer.innerHTML += `
        <div class="menu-item">
          <div class="item-title">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
          <div class="item-price">${item.price}</div>
        </div>
      `;
    });
    sideMenu.classList.add('active');
  }

  function closeMenu() { sideMenu.classList.remove('active'); }
  function placeOrder() { alert('Order routed to kitchen pipeline!'); closeMenu(); }
</script>

</body>
</html>
